name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r orchestrator/requirements.txt
        pip install -r mcp_ast_server/requirements.txt
        pip install -r mcp_sandbox_server/requirements.txt
        pip install -r rag_layer/requirements.txt
        
    - name: Run Tests
      env:
        PYTHONPATH: ".:mcp_ast_server:mcp_sandbox_server:rag_layer"
      run: |
        pytest orchestrator/tests/ mcp_ast_server/tests/ mcp_sandbox_server/tests/ rag_layer/tests/ -v
